name: Bug report
description: Something in the desktop app, the API or the deployment stacks does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include API keys, tokens, server URLs you consider private, recordings or transcripts.
        For security problems, use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app
        - Local mode (on-device server)
        - API server
        - Compose stacks
        - MCP endpoint
        - Docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.2.0-beta.2
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: macOS 15 arm64, Windows 11, Ubuntu 24.04 (X11 or Wayland)
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: The desktop log is main.log in the OS logs folder. Tokens are redacted, but check before pasting.
      render: text
